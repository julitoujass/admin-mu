[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # long lines are tolerated until the codebase is formatted
    "B008", # FastAPI's Depends()/Query() in argument defaults is idiomatic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live Clover sandbox suite is opt-in: `CLOVER_SANDBOX_LIVE=1 pytest -m clover_sandbox`.
addopts = "-m 'not clover_sandbox'"
markers = ["clover_sandbox: live tests against the Clover sandbox (need a real .env, a connected account and a device)"]
filterwarnings = ["ignore::DeprecationWarning:pyiceberg.*"]
