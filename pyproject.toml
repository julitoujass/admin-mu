[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # long lines are tolerated until the codebase is formatted
    "B008", # FastAPI's Depends()/Query() in argument defaults is idiomatic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pyiceberg.*"]
